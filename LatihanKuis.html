<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="LatihanKuis.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="#" class="navbar-brand">SHOES.</a>
        </div>
        <div class="nav-menu" style="display: flex; gap: 35px;">
            <a class="home nav-link active" href="#">Home</a>
            <a class="products nav-link active" href="#">Products</a>
            <a class="about nav-link active" href="#">About</a>
        </div>
    </nav>
    <div class="container">
        <div class="product-card" id="productCard">
            <div class="product-image">
                <img id="productImage" src="https://abazii.github.io/praktikum_pemograman_web/LatianKuis/src/sepatu.jpeg" alt="">
            </div>
            <div class="product-info">
                <p class="category">RUNNING SHOES</p>
                <h2>Air Runner</h2>
                <p class="deskripsi">
                    Sepatu ringan dan nyaman untuk digunakan saat berolahraga maupun aktivitas sehari-hari
                </p>
                <p class="harga">RP 899.000</p>
                <div class="pilih-warna">
                    <p>Pilih Warna: </p>
                    <div class="tombol-warna">
                        <button
                            class="color-button black"
                            onclick="changeColor('black')">
                        </button>
                        <button
                            class="color-button blue"
                            onclick="changeColor('blue')">
                        </button>
                        <button
                            class="color-button cream"
                            onclick="changeColor('cream')">
                        </button>
                    </div>
                </div>
                <button class="cart-button" onclick="addToCart()">
                    Add to Cart
                </button>
            </div>
        </div>
    </div>
</div>
<script src="LatihanKuis.js"></script>
</body>
</html>
